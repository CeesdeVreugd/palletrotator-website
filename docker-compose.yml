# WebsiteBeheerPortal — eigen, losse stack (Portainer: Stacks → Add stack → Repository).
# Websites sluiten aan via twee gedeelde volumes met vaste namen (zie README). Deze stack heeft geen gepubliceerde poorten:
# bereikbaar alleen via Nginx Proxy Manager (netwerk npm_default).
services:
  websitebeheerportal:
    build: .
    image: websitebeheerportal:1
    container_name: websitebeheerportal
    restart: unless-stopped
    environment:
      PORTAL_ADMIN_EMAIL: ${PORTAL_ADMIN_EMAIL:-cees@devreugd-pt.nl}
      PORTAL_ADMIN_PASSWORD: ${PORTAL_ADMIN_PASSWORD:-}
      PORTAL_URL: ${PORTAL_URL:-}
      REQUIRE_2FA: ${REQUIRE_2FA:-all}
      PORTAL_ALLOW_IPS: ${PORTAL_ALLOW_IPS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CHECK_INTERVAL_MIN: ${CHECK_INTERVAL_MIN:-15}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      - portal-data:/data
      - portal-media:/media
      - portal-bridge:/bridge:ro
    networks: [npm_default]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 128

volumes:
  portal-data:
  portal-media:
    name: portal-media
  portal-bridge:
    name: portal-bridge

networks:
  npm_default:
    external: true
