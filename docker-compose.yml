# PalletRotator website — Portainer "Stacks from Git" stack.
# Volgt exact de bestaande VM-conventie (zie Cheese Stock Manager):
# alleen op het externe npm_default-netwerk, geen eigen database
# (statische Astro-build). Sinds V13 is er een kleine formulier-service
# (palletrotator-forms) die brochure-aanvragen naar Laposta stuurt.

services:
  palletrotator-website:
    build:
      context: .
      args:
        # Leeg laten voor productie. Voor testen: STAGING_BASE=palletrotator.devreugd-pt.nl (zie README).
        STAGING_BASE: ${STAGING_BASE:-}
        # Cookieloze statistieken: adres van Umami en website-ID (zie map analytics/). Leeg = uit.
        UMAMI_URL: ${UMAMI_URL:-}
        UMAMI_ID: ${UMAMI_ID:-}
    container_name: palletrotator-website
    restart: unless-stopped
    networks:
      - npm_default
    volumes:
      # Foto's die via de WebsiteBeheerPortal zijn vervangen (alleen-lezen; het portaal schrijft erin).
      - portal-media:/usr/share/nginx/media:ro
      # Hier meldt deze website zich aan bij de WebsiteBeheerPortal (koppelbestand).
      - portal-bridge:/bridge
    # Geen "ports:" nodig - Nginx Proxy Manager bereikt deze container
    # via het interne npm_default-netwerk op containerpoort 80.

  palletrotator-forms:
    build: ./forms-service
    container_name: palletrotator-forms
    restart: unless-stopped
    networks:
      - npm_default
    environment:
      # Zet LAPOSTA_API_KEY als stack-variabele in Portainer (Environment variables).
      # NOOIT de sleutel in de repo zetten.
      LAPOSTA_API_KEY: ${LAPOSTA_API_KEY}
      LAPOSTA_LIST_ID: ${LAPOSTA_LIST_ID:-b12sde1bbp}
      # Optioneel: eigen Laposta-lijst per taal (voor de bevestigingsmail in die taal). Leeg = standaardlijst.
      LAPOSTA_LIST_ID_DE: ${LAPOSTA_LIST_ID_DE:-}
      LAPOSTA_LIST_ID_EN: ${LAPOSTA_LIST_ID_EN:-}
      LAPOSTA_LIST_ID_FR: ${LAPOSTA_LIST_ID_FR:-}
      LAPOSTA_LIST_ID_IT: ${LAPOSTA_LIST_ID_IT:-}
      LAPOSTA_LIST_ID_ES: ${LAPOSTA_LIST_ID_ES:-}
      # Offerte-aanvragen worden per e-mail (SMTP) verstuurd. Zet deze als Portainer-variabelen.
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}   # true voor poort 465
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM:-info@palletrotator.nl}
      MAIL_TO: ${MAIL_TO:-sales@devreugd-pt.nl}
    # Geen "ports:" - alleen bereikbaar via palletrotator-website (nginx /api/).

# Koppeling met de WebsiteBeheerPortal (aparte stack, zie de map/repo "WebsiteBeheerPortal"). Deze volumes zijn gedeeld met die
# stack: bij beide stacks staat dezelfde 'name:'. Het portaal hoeft niet te draaien voor deze website.
volumes:
  portal-media:
    name: portal-media
  portal-bridge:
    name: portal-bridge

networks:
  npm_default:
    external: true
