# Taal/site op basis van het domein waarop de bezoeker binnenkomt (Nginx Proxy Manager geeft de Host-header door).
# palletrotator.nl = nl (standaard) | .de = de | .eu = en | .fr = fr | .it = it | .es = es
# Testen op subdomeinen: de.<basis>, en.<basis>, fr.<basis>, it.<basis>, es.<basis>
map $host $site {
    default          nl;
    ~*\.de$          de;
    ~*^de\.          de;
    ~*\.eu$          en;
    ~*^en\.          en;
    ~*\.fr$          fr;
    ~*^fr\.          fr;
    ~*\.it$          it;
    ~*^it\.          it;
    ~*\.es$          es;
    ~*^es\.          es;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html/$site;
    index index.html;

    # Docker-DNS, zodat nginx ook start als de formulier-service nog niet draait
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Formulieren (brochure -> Laposta) lopen via de aparte container "palletrotator-forms"
    location /api/ {
        set $forms http://palletrotator-forms:3000;
        proxy_pass $forms;
        proxy_set_header Host $host;
        # Nginx Proxy Manager geeft het echte bezoeker-IP mee in X-Forwarded-For
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Real-IP $http_x_real_ip;
        client_max_body_size 16k;
        proxy_read_timeout 20s;
    }

    # Astro's static build writes clean URLs as /pad/index.html
    location / {
        try_files $uri $uri/ $uri/index.html /404.html;
    }

    location = /404.html {
        internal;
    }

    # Brochure-PDF: altijd als download, nooit door zoekmachines indexeren
    # Ontbreekt de brochure van een taal (nog) in de build, dan krijgt de bezoeker de Engelse versie i.p.v. een 404.
    location /downloads/ {
        try_files $uri /downloads/PalletRotator-brochure-en.pdf;
        add_header X-Robots-Tag "noindex";
        add_header Cache-Control "no-cache";
    }

    # Long cache for hashed/static assets, short cache for HTML
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(?:png|jpg|jpeg|svg|webp|ico|css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
